<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>星夜魔奏 - 星之節奏反應點擊器</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0d0826 0%, #1a103c 50%, #29184d 100%);
      --accent-star: #ffe066;
      --accent-magic: #d47aff;
      --accent-cyan: #74ebd5;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* 頂部資訊列 */
    .header-bar {
      position: absolute;
      top: 20px;
      width: 90%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .pill {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-weight: bold;
      font-size: 1rem;
    }

    /* 節拍指示條 */
    .beat-pulse {
      position: absolute;
      top: 75px;
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .beat-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.1s ease;
    }

    .beat-dot.active {
      background: var(--accent-star);
      transform: scale(1.4);
      box-shadow: 0 0 12px var(--accent-star);
    }

    /* 遊戲主舞台 */
    #playArea {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* 音符物件容器 */
    .note-node {
      position: absolute;
      width: 70px;
      height: 70px;
      transform: translate(-50%, -50%);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 音符核心按鈕 */
    .note-core {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff9ff3, #ab47bc);
      border: 3px solid #fff;
      box-shadow: 0 0 15px rgba(212, 122, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      pointer-events: none;
      transition: transform 0.1s;
    }

    /* 縮小判定圈 */
    .approach-circle {
      position: absolute;
      border-radius: 50%;
      border: 3px solid var(--accent-cyan);
      box-shadow: 0 0 12px var(--accent-cyan);
      pointer-events: none;
    }

    /* 判定飄字 */
    .judge-float {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 1.4rem;
      font-weight: 900;
      pointer-events: none;
      animation: floatUp 0.6s ease-out forwards;
      z-index: 20;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
      50% { transform: translate(-50%, -80px) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -100px) scale(1); }
    }

    .judge-perfect { color: var(--accent-star); text-shadow: 0 0 10px #ffe066; }
    .judge-great { color: var(--accent-cyan); text-shadow: 0 0 10px #74ebd5; }
    .judge-miss { color: #ff6b81; text-shadow: 0 0 10px #ff6b81; }

    /* 開始與結算彈窗 */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 8, 38, 0.85);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1.5px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      padding: 30px 40px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    h1 {
      color: var(--accent-star);
      margin-bottom: 12px;
      font-size: 1.8rem;
    }

    p {
      color: #d1c4e9;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .btn {
      background: linear-gradient(45deg, #d47aff, #8c52ff);
      border: none;
      color: white;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 24px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(140, 82, 255, 0.4);
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="pill">⏱️ 時間：<span id="timerText">30</span>s</div>
    <div class="pill">⭐ 分數：<span id="scoreText">0</span></div>
    <div class="pill">🔥 <span id="comboText">0</span> Combo</div>
  </div>

  <!-- 4拍節奏提示點 -->
  <div class="beat-pulse">
    <div class="beat-dot" id="dot0"></div>
    <div class="beat-dot" id="dot1"></div>
    <div class="beat-dot" id="dot2"></div>
    <div class="beat-dot" id="dot3"></div>
  </div>

  <div id="playArea"></div>

  <!-- 開始介面 -->
  <div class="modal" id="startModal">
    <div class="card">
      <h1>✨ 星夜魔奏 ✨</h1>
      <p>跟著背景的 4 拍節奏！<br>星星圈圈縮小到跟核心一樣大時點擊！<br>連續點擊創造高分連擊吧～</p>
      <button class="btn" id="startBtn">🎵 開啟音樂並開始</button>
    </div>
  </div>

  <!-- 結算介面 -->
  <div class="modal" id="endModal" style="display: none;">
    <div class="card">
      <h1>🎉 演出結束 🎉</h1>
      <p id="resultDetails"></p>
      <button class="btn" id="restartBtn">💫 再玩一次</button>
    </div>
  </div>

  <script>
    // --- 1. 原生 Web Audio 節奏與背景音樂合成引擎 ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    const BPM = 100;
    const BEAT_DURATION = 60 / BPM; // 一拍約 0.6 秒
    let currentBeat = 0;
    let bgmInterval = null;

    // 播放和弦樂音
    function playSynth(freq, duration, type = 'sine', gainVal = 0.15) {
      if (!actx) return;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, actx.currentTime);
      gain.gain.setValueAtTime(gainVal, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + duration);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + duration);
    }

    // 播放節奏鼓點 (大鼓與小鼓)
    function playDrum(isKick = true) {
      if (!actx) return;
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      if (isKick) {
        osc.frequency.setValueAtTime(120, actx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, actx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.15);
      } else {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(200, actx.currentTime);
        gain.gain.setValueAtTime(0.18, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.12);
      }
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + 0.15);
    }

    // 4拍循環和弦：C -> G -> Am -> F
    const chords = [
      [261.63, 329.63, 392.00], // C
      [196.00, 246.94, 293.66], // G
      [220.00, 261.63, 329.63], // Am
      [174.61, 220.00, 261.63]  // F
    ];

    function stepBGM() {
      const beatInBar = currentBeat % 4;
      
      // 更新上方節奏拍點燈
      for (let i = 0; i < 4; i++) {
        document.getElementById(`dot${i}`).classList.toggle('active', i === beatInBar);
      }

      // 鼓點：第 1, 3 拍大鼓，第 2, 4 拍小鼓
      playDrum(beatInBar % 2 === 0);

      // 播放旋律和弦
      const chord = chords[beatInBar];
      chord.forEach(freq => playSynth(freq, BEAT_DURATION * 0.9, 'triangle', 0.08));

      // 每個小節有節奏地生成新的音符圈圈（可連續冒出）
      if (isPlaying) {
        spawnRhythmNote();
      }

      currentBeat++;
    }

    // --- 2. 遊戲主邏輯 ---
    let isPlaying = false;
    let score = 0;
    let combo = 0;
    let maxCombo = 0;
    let timeLeft = 30;
    let gameTimer = null;
    const playArea = document.getElementById('playArea');
    const scoreText = document.getElementById('scoreText');
    const comboText = document.getElementById('comboText');
    const timerText = document.getElementById('timerText');

    function startGame() {
      if (!actx) actx = new AudioContext();
      if (actx.state === 'suspended') actx.resume();

      document.getElementById('startModal').style.display = 'none';
      document.getElementById('endModal').style.display = 'none';
      playArea.innerHTML = '';

      isPlaying = true;
      score = 0;
      combo = 0;
      maxCombo = 0;
      timeLeft = 30;
      currentBeat = 0;

      scoreText.textContent = score;
      comboText.textContent = combo;
      timerText.textContent = timeLeft;

      // 啟動背景音樂循環
      bgmInterval = setInterval(stepBGM, BEAT_DURATION * 1000);
      stepBGM(); // 立即響起第一拍

      // 倒數計時器
      gameTimer = setInterval(() => {
        timeLeft--;
        timerText.textContent = timeLeft;
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    // 產生隨機位置的音符圈圈
    function spawnRhythmNote() {
      const node = document.createElement('div');
      node.className = 'note-node';

      // 隨機分佈在螢幕周圍（避開邊界）
      const padding = 100;
      const x = Math.random() * (window.innerWidth - padding * 2) + padding;
      const y = Math.random() * (window.innerHeight - padding * 2) + padding;
      node.style.left = `${x}px`;
      node.style.top = `${y}px`;

      // 核心魔力晶球
      const core = document.createElement('div');
      core.className = 'note-core';
      core.textContent = ['🌟', '✨', '🔮', '💫'][Math.floor(Math.random() * 4)];

      // 縮小的外環
      const ring = document.createElement('div');
      ring.className = 'approach-circle';

      node.appendChild(ring);
      node.appendChild(core);
      playArea.appendChild(node);

      // 動畫設定：縮小時間正好等於 2 個拍子（讓玩家有節奏準備時間）
      const duration = BEAT_DURATION * 2 * 1000;
      const targetSize = 65;
      const startSize = 200;
      const spawnTime = performance.now();
      let clicked = false;

      function animate(now) {
        if (clicked || !isPlaying) return;
        const elapsed = now - spawnTime;
        const progress = elapsed / duration;

        if (progress >= 1.25) {
          // 太晚點擊 -> MISS
          triggerJudge('miss', x, y);
          node.remove();
          return;
        }

        const size = startSize - (startSize - targetSize) * progress;
        ring.style.width = `${Math.max(size, 20)}px`;
        ring.style.height = `${Math.max(size, 20)}px`;
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      // 點擊判定（支援滑鼠點擊與手機觸碰）
      node.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        if (clicked || !isPlaying) return;
        clicked = true;

        const elapsed = performance.now() - spawnTime;
        const diff = Math.abs(elapsed - duration); // 與完美節奏點的秒數差

        if (diff < 90) {
          triggerJudge('perfect', x, y);
        } else if (diff < 200) {
          triggerJudge('great', x, y);
        } else {
          triggerJudge('miss', x, y);
        }

        node.remove();
      });
    }

    function triggerJudge(type, x, y) {
      const float = document.createElement('div');
      float.className = `judge-float judge-${type}`;
      float.style.left = `${x}px`;
      float.style.top = `${y}px`;

      if (type === 'perfect') {
        float.textContent = 'PERFECT! ✨';
        score += 100;
        combo++;
        playSynth(880, 0.2, 'sine', 0.25); // 高音提示
      } else if (type === 'great') {
        float.textContent = 'GREAT! 💫';
        score += 50;
        combo++;
        playSynth(659.25, 0.15, 'sine', 0.2);
      } else {
        float.textContent = 'MISS... 💨';
        combo = 0;
        playSynth(150, 0.2, 'sawtooth', 0.2);
      }

      if (combo > maxCombo) maxCombo = combo;
      scoreText.textContent = score;
      comboText.textContent = combo;

      playArea.appendChild(float);
      setTimeout(() => float.remove(), 600);
    }

    function endGame() {
      isPlaying = false;
      clearInterval(gameTimer);
      clearInterval(bgmInterval);
      playArea.innerHTML = '';

      document.getElementById('resultDetails').innerHTML = `
        最終總分：<b>${score}</b> 分<br>
        最高連擊：<b>${maxCombo}</b> Combo<br>
        評價：${score >= 1800 ? '🌌 星空節奏神人！' : score >= 1000 ? '✨ 閃耀節奏使！' : '💤 沉睡星子'}
      `;
      document.getElementById('endModal').style.display = 'flex';
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);
  </script>
</body>
</html>
